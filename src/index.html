<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Cuarto Oscuro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark room. Safelight glow behind a central print tray; a control rail. */
:root{
  --room:#120707;--ink:#e9ddd4;--muted:#9a7e76;--safe:#e03a2a;--safe-deep:#6b140d;
  --line:#3a201c;--panel:#1b0d0b;
  --display:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);font-family:var(--mono);font-size:14px;min-height:100%;
  background-image:radial-gradient(120% 90% at 50% -10%, rgba(224,58,42,.22), rgba(224,58,42,.05) 40%, transparent 65%);}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1000px;margin:0 auto;padding-block:clamp(16px,4vw,32px)}
header{text-align:center;margin-bottom:16px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(2.3rem,7vw,3.4rem);margin:0;letter-spacing:.02em;color:#f3e7df;text-shadow:0 0 22px rgba(224,58,42,.45)}
.tagline{color:var(--muted);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;margin-top:.4rem}
.studio{display:grid;grid-template-columns:1fr 310px;gap:20px;align-items:start}
@media(max-width:780px){.studio{grid-template-columns:1fr}}
.bench{display:flex;flex-direction:column;align-items:center;gap:12px}
.tray{position:relative;padding:16px;border-radius:10px;background:linear-gradient(160deg,#241210,#140a09);border:1px solid var(--line);box-shadow:inset 0 2px 20px rgba(0,0,0,.6),0 10px 40px -18px rgba(0,0,0,.8)}
.tray.wet{box-shadow:inset 0 2px 30px rgba(224,58,42,.12),0 10px 40px -14px rgba(0,0,0,.8)}
.paper{display:block;background:#0b0606;border-radius:3px;touch-action:none;cursor:crosshair;max-width:100%;height:auto}
.liquid{position:absolute;inset:16px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(120% 120% at 30% 20%, rgba(224,58,42,.10), transparent 60%);mix-blend-mode:screen}
.tray.wet .liquid{opacity:1}
.status{font-family:var(--mono);color:var(--safe);font-size:.82rem;letter-spacing:.1em;min-height:1.2em;text-align:center}
.timer{font-family:var(--display);font-size:2.2rem;color:#f3e7df;line-height:1;min-height:1em}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.rail h2{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0;color:#f3e7df}
.step{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
label{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
input[type=range]{width:100%;accent-color:var(--safe)}
.tools,.segs{display:flex;gap:6px}
.tool,.seg{flex:1;padding:8px 4px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;cursor:pointer;transition:.15s}
.tool[aria-pressed=true],.seg[aria-pressed=true]{border-color:var(--safe);color:#f3e7df;background:rgba(224,58,42,.14)}
.btn{width:100%;padding:11px;border:1px solid var(--safe-deep);background:rgba(224,58,42,.16);color:#f6e9e3;border-radius:9px;font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:rgba(224,58,42,.3)}
.btn.primary{background:var(--safe);border-color:var(--safe);color:#1a0906;font-weight:500}
.btn.gold{background:#c9a24a;border-color:#c9a24a;color:#1a0906;font-weight:500}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-row{display:flex;gap:8px}
.hint{font-size:.72rem;color:var(--muted);line-height:1.5}
.loadbtn{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--safe);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:center}
input[type=file]{display:none}
.saferow{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.switch{cursor:pointer;color:var(--muted);font-size:.72rem;letter-spacing:.1em}
.lab{font-size:.78rem;color:var(--muted);text-align:center;margin-top:10px}
body.lit{background:#d9cfc6;background-image:none;color:#241a16;transition:background .8s,color .8s}
body.lit h1{color:#241a16;text-shadow:none}
body.lit .rail{background:#efe7df;border-color:#cbbdb2}
body.lit .tray{background:linear-gradient(160deg,#cdbfb4,#b6a699);border-color:#a8988c}
body.lit .status,body.lit .loadbtn{color:#7a2016}
body.lit .tagline,body.lit label,body.lit .hint,body.lit .step,body.lit .lab,body.lit .switch{color:#6b5a50}
.sg-panel{display:none}
.sg-panel.active{display:block}
.grade-panel.hidden{display:none}
.timer-yellow{color:#d4a017}
.timer-magenta{color:#c050b8}
.btn.sg-active{border-color:#c9a24a;color:#c9a24a;background:rgba(201,162,74,.14)}
</style>

<div class="wrap">
  <header>
    <h1>Cuarto Oscuro</h1>
    <div class="tagline">Revelado analógico · resucitado</div>
  </header>
  <div class="studio">
    <div class="bench">
      <div class="timer" id="timer"></div>
      <div class="tray" id="tray">
        <canvas class="paper" id="paper" width="460" height="560"></canvas>
        <div class="liquid"></div>
      </div>
      <div class="status" id="status">Coloca el negativo y ajusta la exposición.</div>
    </div>
    <aside class="rail">
      <div><div class="step" id="stepLabel">Paso 1 · Ampliadora</div><h2 id="stepTitle">Componer</h2></div>
      <div>
        <label>Negativo</label>
        <label class="loadbtn" for="file">Cargar imagen</label>
        <input type="file" id="file" accept="image/*">
      </div>
      <div>
        <label>Exposición · <span id="expVal">9</span> s</label>
        <input type="range" id="exposure" min="2" max="20" value="9" step="1">
      </div>
      <div class="grade-panel" id="gradePanel">
        <label>Contraste (grado) · <span id="conVal">3</span></label>
        <input type="range" id="contrast" min="1" max="5" value="3" step="1">
      </div>
      <button class="btn" id="splitToggle" aria-pressed="false" style="margin-top:-4px">Gradación dividida</button>
      <div class="sg-panel" id="sgPanel">
        <label>Suave (amarillo) · <span id="softVal">5</span> s</label>
        <input type="range" id="softTime" min="0" max="20" value="5" step="1">
        <label style="margin-top:8px">Duro (magenta) · <span id="hardVal">4</span> s</label>
        <input type="range" id="hardTime" min="0" max="20" value="4" step="1">
      </div>
      <div>
        <label>Pincel sobre la copia</label>
        <div class="tools">
          <button class="tool" id="tDodge" aria-pressed="false">Reservar</button>
          <button class="tool" id="tBurn" aria-pressed="false">Quemar</button>
          <button class="tool" id="tNone" aria-pressed="true">Ninguno</button>
        </div>
        <div class="row" style="margin-top:8px"><label style="margin:0">Tamaño</label><input type="range" id="brush" min="20" max="120" value="60"></div>
      </div>
      <div>
        <label>Virado (al fijar)</label>
        <div class="segs">
          <button class="seg" id="vNeutral" aria-pressed="true">Neutro</button>
          <button class="seg" id="vSepia" aria-pressed="false">Sepia</button>
          <button class="seg" id="vSelenium" aria-pressed="false">Selenio</button>
        </div>
      </div>
      <div><label>Grano · <span id="grVal">medio</span></label><input type="range" id="grain" min="0" max="30" value="14"></div>
      <div class="btn-row"><button class="btn primary" id="expose">Exponer</button><button class="btn" id="develop" disabled>Revelar</button></div>
      <button class="btn" id="testStrip" disabled>Tira de prueba</button>
      <div class="btn-row"><button class="btn" id="fix" disabled>Parar + Fijar</button><button class="btn" id="reset">Nueva copia</button></div>
      <button class="btn gold" id="download" disabled>Descargar copia</button>
      <div class="saferow"><span class="switch" id="light">Encender la luz</span><span class="switch" id="sound">Sonido: on</span></div>
    </aside>
  </div>
  <div class="lab">Reservar aclara · Quemar oscurece · sube el contraste para negros más duros. Expón 7–11 s para una copia equilibrada.</div>
</div>

<script>
const $=s=>document.querySelector(s);
// ---------- audio ----------
let ac=null, soundOn=true, waterNode=null;
function ensureAudio(){try{if(!ac){const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();}if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function blip(f,d,g,t){if(!soundOn||!ac)return;try{const o=ac.createOscillator(),ga=ac.createGain();o.type=t||'square';o.frequency.value=f;
  ga.gain.setValueAtTime(0.0001,ac.currentTime);ga.gain.exponentialRampToValueAtTime(g||0.15,ac.currentTime+0.005);
  ga.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(d||0.05));o.connect(ga).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||0.05)+0.02);}catch(e){}}
const clack=()=>blip(180,0.07,0.22,'square'), tick=()=>blip(1500,0.03,0.08,'square');
function waterStart(){if(!soundOn||!ac||waterNode)return;try{const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*0.5;const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;const g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(0.06,ac.currentTime+0.6);
  src.connect(lp).connect(g).connect(ac.destination);src.start();waterNode={src,g};}catch(e){}}
function waterStop(){if(!waterNode)return;try{const{src,g}=waterNode;g.gain.linearRampToValueAtTime(0.0001,ac.currentTime+0.5);src.stop(ac.currentTime+0.6);}catch(e){}waterNode=null;}

const paper=$('#paper'), ctx=paper.getContext('2d');
let W=paper.width,H=paper.height;
let rawGray=null, mask=null;
let state='compose', tool='none', brush=60, exposure=9, grade=3, grainAmt=14, toner='neutral';
let splitGrade=false, softTime=5, hardTime=4;

function curveK(v,k){ return Math.min(1,Math.max(0,(v-0.5)*k+0.5)); }
function curve(v){ return curveK(v, 0.8+(grade-1)*0.35); }
function curveSoft(v){ return curveK(v, 0.80); }  // grade 00
function curveHard(v){ return curveK(v, 2.20); }  // grade 5

function loadImage(src){
  const img=new Image();
  img.onload=()=>{
    const ar=img.width/img.height, boxAr=W/H; let dw,dh;
    if(ar>boxAr){dw=W;dh=W/ar;}else{dh=H;dw=H*ar;}
    const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
    o.fillStyle='#000';o.fillRect(0,0,W,H);o.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
    const d=o.getImageData(0,0,W,H).data; rawGray=new Float32Array(W*H);
    for(let i=0,p=0;i<d.length;i+=4,p++) rawGray[p]=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
    mask=new Float32Array(W*H).fill(1); state='compose'; drawPreview(); setStep();
  };
  img.onerror=()=>{ $('#status').textContent='No pude leer esa imagen. Prueba otra.'; };
  img.src=src;
}
function drawPreview(){
  const im=ctx.createImageData(W,H);
  for(let p=0,i=0;p<W*H;p++,i+=4){
    let v;
    if(splitGrade){
      const eNs=softTime/9, eNh=hardTime/9;
      const combined=Math.pow(curveSoft(rawGray[p]),Math.max(0.001,eNs))*Math.pow(curveHard(rawGray[p]),Math.max(0.001,eNh));
      v=Math.round(255*(0.14+0.10*Math.min(1,combined)));
    } else {
      v=Math.round(255*(0.14+0.10*curve(rawGray[p])));
    }
    im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;
  }
  ctx.putImageData(im,0,0); drawMaskOverlay();
}
function drawMaskOverlay(){
  const im=ctx.getImageData(0,0,W,H),d=im.data;
  for(let p=0,i=0;p<W*H;p++,i+=4){const m=mask[p];
    if(m<0.98)d[i+2]=Math.min(255,d[i+2]+(1-m)*140);else if(m>1.02)d[i]=Math.min(255,d[i]+(m-1)*120);}
  ctx.putImageData(im,0,0);
}
const STRIP_TIMES=[3,6,9,12,15];
function drawTestStrip(){
  if(!rawGray)return;
  const bw=Math.floor(W/STRIP_TIMES.length);
  const im=ctx.createImageData(W,H);
  for(let bi=0;bi<STRIP_TIMES.length;bi++){
    const t=STRIP_TIMES[bi];
    const x0=bi*bw, x1=(bi===STRIP_TIMES.length-1)?W:x0+bw;
    if(splitGrade){
      const total=softTime+hardTime;
      const ratio=total>0?softTime/total:0.5;
      const tS=t*ratio, tH=t*(1-ratio);
      const eNs=tS/9, eNh=tH/9;
      for(let y=0;y<H;y++){
        for(let x=x0;x<x1;x++){
          const p=y*W+x;
          const val=Math.min(1,Math.pow(curveSoft(rawGray[p]),Math.max(0.001,eNs*mask[p]))*Math.pow(curveHard(rawGray[p]),Math.max(0.001,eNh*mask[p])));
          const v=Math.round(255*(1-val));
          const i4=p*4;im.data[i4]=im.data[i4+1]=im.data[i4+2]=v;im.data[i4+3]=255;
        }
      }
    } else {
      const eN=t/9;
      for(let y=0;y<H;y++){
        for(let x=x0;x<x1;x++){
          const p=y*W+x;
          const val=Math.pow(curve(rawGray[p]),eN*mask[p]);
          const v=Math.round(255*(1-val));
          const i4=p*4;im.data[i4]=im.data[i4+1]=im.data[i4+2]=v;im.data[i4+3]=255;
        }
      }
    }
  }
  ctx.putImageData(im,0,0);
  applyGrain();
  // Draw labels
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=3;
  ctx.font='500 13px "IBM Plex Mono",ui-monospace,monospace';
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.textAlign='center';
  // Band dividers
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(let bi=0;bi<STRIP_TIMES.length;bi++){
    const x0=bi*bw;
    ctx.fillText(STRIP_TIMES[bi]+'s',x0+bw/2,18);
    if(bi>0){ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,H);ctx.stroke();}
  }
  ctx.restore();
  // One-shot click to pick a band
  function onStripClick(e){
    paper.removeEventListener('click',onStripClick);
    const rect=paper.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*W/rect.width;
    const bi=Math.min(STRIP_TIMES.length-1,Math.max(0,Math.floor(cx/bw)));
    const picked=STRIP_TIMES[bi];
    if(splitGrade){
      const total=softTime+hardTime;
      const ratio=total>0?softTime/total:0.5;
      softTime=Math.round(picked*ratio);
      hardTime=picked-softTime;
      $('#softTime').value=softTime;$('#softVal').textContent=softTime;
      $('#hardTime').value=hardTime;$('#hardVal').textContent=hardTime;
    } else {
      exposure=picked;
      $('#exposure').value=exposure;$('#expVal').textContent=exposure;
    }
    drawPreview();
  }
  paper.addEventListener('click',onStripClick);
}

let painting=false;
function paintAt(x,y){ if(tool==='none'||!rawGray)return; const r=brush/2,delta=(tool==='dodge'?-0.04:0.04);
  for(let yy=Math.max(0,y-r);yy<Math.min(H,y+r);yy++)for(let xx=Math.max(0,x-r);xx<Math.min(W,x+r);xx++){
    const dx=xx-x,dy=yy-y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<r){const fall=1-dist/r,p=yy*W+xx;mask[p]=Math.min(1.8,Math.max(0.45,mask[p]+delta*fall));}}
  if(state==='compose')drawPreview(); }
function evtXY(e){const rect=paper.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return [Math.round(cx*W/rect.width),Math.round(cy*H/rect.height)];}
paper.addEventListener('pointerdown',e=>{ensureAudio();if(state==='compose'){painting=true;const[x,y]=evtXY(e);paintAt(x,y);}});
paper.addEventListener('pointermove',e=>{if(painting){const[x,y]=evtXY(e);paintAt(x,y);}});
window.addEventListener('pointerup',()=>painting=false);

function setStep(){
  const map={compose:['Paso 1 · Ampliadora','Componer','Reserva/quema y pulsa Exponer.'],
    latent:['Paso 2 · Papel expuesto','Latente','Papel en blanco. Pulsa Revelar.'],
    developing:['Paso 3 · Revelador','Revelando…','La imagen emerge en la cubeta.'],
    devdone:['Paso 3 · Revelador','Revelada','Elige virado y pulsa Fijar.'],
    fixed:['Paso 4 · Fijado','Copia fijada','Enciende la luz o descarga la copia.']};
  const m=map[state]||map.compose;
  $('#stepLabel').textContent=m[0];$('#stepTitle').textContent=m[1];$('#status').textContent=m[2];
  $('#expose').disabled=state!=='compose'; $('#develop').disabled=state!=='latent';
  $('#fix').disabled=!(state==='developing'||state==='devdone'); $('#download').disabled=state!=='fixed';
  $('#testStrip').disabled=!(state==='compose'&&rawGray!==null);
}
function expose(){
  if(state!=='compose'||!rawGray)return;
  if(splitGrade&&softTime===0&&hardTime===0){$('#status').textContent='Tiempo de exposición cero. Ajusta los tiempos.';return;}
  state='exposing';setStep();$('#expose').disabled=true;ensureAudio();clack();
  ctx.fillStyle='#efe9e2';ctx.fillRect(0,0,W,H);
  const tmr=$('#timer');
  if(splitGrade){
    const runPhase=(dur,label,tintColor,onDone)=>{
      if(dur===0){onDone();return;}
      ctx.fillStyle='#efe9e2';ctx.fillRect(0,0,W,H);
      ctx.fillStyle=tintColor;ctx.fillRect(0,0,W,H);
      $('#status').textContent='Exponiendo filtro '+label+'…';
      let t=dur;
      const iv=setInterval(()=>{
        tmr.className='timer '+(label==='amarillo'?'timer-yellow':'timer-magenta');
        tmr.textContent=(label==='amarillo'?'Amarillo':'Magenta')+' · '+t+'s';
        if(t>0)tick();t--;
        if(t<0){clearInterval(iv);tmr.className='timer';tmr.textContent='';clack();
          ctx.fillStyle='#ece6df';ctx.fillRect(0,0,W,H);onDone();}
      },120);
    };
    runPhase(softTime,'amarillo','rgba(255,210,0,.18)',()=>{
      runPhase(hardTime,'magenta','rgba(200,0,180,.14)',()=>{
        state='latent';setStep();
      });
    });
  } else {
    let t=exposure;$('#status').textContent='Exponiendo bajo la ampliadora…';
    const iv=setInterval(()=>{tmr.textContent=t+'s';if(t>0)tick();t--;if(t<0){clearInterval(iv);tmr.textContent='';clack();
      ctx.fillStyle='#ece6df';ctx.fillRect(0,0,W,H);state='latent';setStep();}},120);
  }
}
let finalArr=null;
function develop(){
  if(state!=='latent')return; state='developing';setStep();$('#tray').classList.add('wet');ensureAudio();waterStart();
  const eN=exposure/9; finalArr=new Float32Array(W*H); const order=new Float32Array(W*H);
  if(splitGrade){
    const eNs=softTime/9, eNh=hardTime/9;
    for(let p=0;p<W*H;p++){
      const e=eNs*mask[p], eh=eNh*mask[p];
      const out=Math.min(1,Math.pow(curveSoft(rawGray[p]),Math.max(0.001,e))*Math.pow(curveHard(rawGray[p]),Math.max(0.001,eh)));
      finalArr[p]=out;order[p]=out;
    }
  } else {
    for(let p=0;p<W*H;p++){const e=eN*mask[p];const out=Math.pow(curve(rawGray[p]),e);finalArr[p]=out;order[p]=out;}
  }
  let start=null,dur=7000;
  function frame(ts){ if(!start)start=ts;let t=(ts-start)/dur;if(t>1)t=1;
    const im=ctx.createImageData(W,H),d=im.data;
    for(let p=0,i=0;p<W*H;p++,i+=4){let pr=(t*1.35-order[p]*0.5);pr=Math.min(1,Math.max(0,pr/0.85));
      const v=Math.round(255*(1-(1-finalArr[p])*pr));d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
    ctx.putImageData(im,0,0);
    if(t<1)requestAnimationFrame(frame);
    else{
      state='devdone';applyGrain();waterStop();setStep();
      if(splitGrade){
        const total=(softTime+hardTime)/9;
        $('#status').textContent=total<0.8?'Clara: subexpuesta.':total>1.25?'Densa: sobreexpuesta.':'Buenos negros, buenas luces.';
      } else {
        $('#status').textContent=eN<0.8?'Clara: subexpuesta.':eN>1.25?'Densa: sobreexpuesta.':'Buenos negros, buenas luces.';
      }
    }
  }
  requestAnimationFrame(frame);
}
function applyGrain(){ if(grainAmt<=0)return; const im=ctx.getImageData(0,0,W,H),d=im.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*grainAmt;d[i]+=n;d[i+1]+=n;d[i+2]+=n;} ctx.putImageData(im,0,0);}
function applyTone(){
  const im=ctx.getImageData(0,0,W,H),d=im.data;
  for(let i=0;i<d.length;i+=4){const v=d[i];
    if(toner==='sepia'){d[i]=Math.min(255,v*1.07+14);d[i+1]=Math.min(255,v*1.0+6);d[i+2]=v*0.80;}
    else if(toner==='selenium'){d[i]=Math.min(255,v*0.98+8);d[i+1]=v*0.96;d[i+2]=Math.min(255,v*1.04+10);}
    else {d[i]=Math.min(255,v*1.03+4);d[i+2]=v*0.97;}}
  ctx.putImageData(im,0,0);
  ctx.strokeStyle='rgba(245,240,232,.92)';ctx.lineWidth=10;ctx.strokeRect(5,5,W-10,H-10);
}
function fix(){ if(state!=='devdone'&&state!=='developing')return; state='fixed';applyTone();waterStop();ensureAudio();blip(90,0.12,0.12,'sine');
